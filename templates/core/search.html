{% extends 'base.html' %}{% block content %}<section class="shell page-masthead"><span class="eyebrow">Your next step, easier to find</span><h1>What are you looking for?</h1><p>Search this programme or explore public pages across the GECP network.</p><form action="/search/" method="get" hx-get="/search/" hx-target="#search-results" hx-swap="outerHTML" hx-push-url="true" class="search-form"><label for="search-q" class="sr-only">Search terms</label><div class="search-input-row"><input id="search-q" name="q" maxlength="200" value="{{ query }}" placeholder="Programmes, opportunities, skills, resources…"><button class="button">Search ↗</button></div><div class="search-options"><fieldset><legend class="sr-only">Search scope</legend><label><input type="radio" name="scope" value="site" {% if scope == 'site' %}checked{% endif %}> This site</label><label><input type="radio" name="scope" value="all" {% if scope == 'all' %}checked{% endif %}> All GECP</label></fieldset><label>Programme <select name="programme"><option value="">All programmes</option>{% for programme in network_programmes %}<option value="{{ programme.code }}" {% if programme_code == programme.code %}selected{% endif %}>{{ programme.code|upper }}</option>{% endfor %}</select></label><span class="search-hint">Programme filter applies to All GECP.</span></div></form></section><section class="shell section section-topless">{% include 'core/partials/search_results.html' %}</section>{% endblock %}
