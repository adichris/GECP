{% load wagtailcore_tags wagtailimages_tags %}<article class="journal-card">{% if item.image %}{% image item.image fill-700x420 alt=item.title %}{% else %}<div class="journal-art" aria-hidden="true"><span>{{ item.topic }}</span><b>↗</b><i></i></div>{% endif %}<div class="journal-copy"><span class="eyebrow">{{ item.topic }} · {{ item.published_date|date:'j M Y' }}</span><h3><a href="{% pageurl item %}">{{ item.title }}</a></h3><p>{{ item.summary|truncatewords:32 }}</p><a class="text-link" href="{% pageurl item %}">Read article →</a></div></article>
